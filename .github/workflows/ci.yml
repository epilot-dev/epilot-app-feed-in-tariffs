name: CI

# Tests on every PR. On main: tests, then `sst deploy --stage prod` of the
# backend (tariff API + flow action webhook). The frontend capability bundle is
# shipped separately as an app version (frontend/app.zip) and is not touched here.
#
# AWS auth is GitHub OIDC (no long-lived keys). The deploy role ARN is the
# AWS_DEPLOY_ROLE_ARN variable on the `prod` GitHub Environment. That environment
# must only allow the `main` branch: the role trusts the environment, not the branch.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      action:
        description: deploy or diff
        required: true
        default: deploy
        type: choice
        options: [deploy, diff]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Unit tests
        run: npx vitest run

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      AWS_REGION: eu-central-1
      ACTION: ${{ inputs.action || 'deploy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Before AWS credentials exist, so dependency install scripts can't read them
      - name: Install deps
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SST ${{ env.ACTION }}
        run: |
          if [ "$ACTION" = "diff" ]; then
            npx sst diff --stage prod
          else
            npx sst deploy --stage prod
          fi
